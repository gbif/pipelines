apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  name: identifier-orphaned-export
spec:
  image: docker-mirror.gbif.org/ingest-spark-jobs:4.0.46
  sparkImage:
    productVersion: 3.5.1
    stackableVersion: 24.7.0
    custom: docker-mirror.gbif.org/extended-stackable/spark-k8s-all-deps:3.5.1-stackable24.7.0-1.3.0
  mode: cluster
  mainApplicationFile: hdfs://gbif-hdfs/user/dave/spark-jobs.jar
  mainClass: org.gbif.pipelines.spark.diag.OrphanedIdentifiersPipeline
  vectorAggregatorConfigMapName: gbif-vector-aggregator-discovery
  s3connection:
    inline:
      host: minio
      port: 9000
      accessStyle: Path
      credentials:
        secretClass: gbif-spark-history-production-credentials-class
  logFileDirectory:
    s3:
      prefix: /
      bucket:
        inline:
          bucketName: spark-history-prod-bucket
  args:
    - "--appName=identifier-orphaned-export"
    - "--datasetIdsFile=/tmp/identifier_datasets.txt"
  sparkConf:
    "spark.driver.extraJavaOptions": "-XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35"
    "spark.executor.extraJavaOptions": "-XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35 -XX:ConcGCThread=20"
    "spark.shuffle.readHostLocalDisk": "true"
    "spark.shuffle.file.buffer": "1MB"
    "spark.shuffle.spill.diskWriteBufferSize": "1MB"
    "spark.shuffle.unsafe.file.output.buffer": "1MB"
    "spark.shuffle.io.maxRetries": "15"
    "spark.shuffle.io.retryWait": "300s"
    "spark.shuffle.io.connectionTimeout": "600s"
    "spark.files.fetchTimeout": "300s"
    "spark.reducer.maxSizeInFlight": "96m"
    "spark.reducer.maxBlocksInFlightPerAddress": "30"
    "spark.default.parallelism": "5000"
    "spark.jars.ivy": "/tmp"
    "spark.jars.ivySettings": "/tmp/ivy-settings.xml"
    "spark.broadcast.compress": "true"
    "spark.checkpoint.compress": "true"
    "spark.executor.heartbeatInterval": "30s"
    "spark.network.timeout": "300s"
    "spark.rpc.lookupTimeout": "300s"
    "spark.io.compression.codec": "snappy"
    "spark.scheduler.blacklist.timeout": "5m"
    "spark.rdd.compress": "true"
    "spark.sql.hive.dropTableInPurge": "true"
    "spark.driver.extraClassPath": "/etc/hadoop/conf/:/etc/gbif/:/stackable/spark/extra-jars/*:/stackable/spark/jobs/"
    "spark.executor.extraClassPath": "/etc/hadoop/conf/:/etc/gbif/:/stackable/spark/extra-jars/*:/stackable/spark/jobs/"
    "spark.executor.instances": "20"
    "spark.kubernetes.scheduler.name": "yunikorn"
    "spark.kubernetes.executor.label.queue": "root.prod.pipelines"
    "spark.kubernetes.submit.label.queue": "root.prod.pipelines"
    "spark.executor.memoryOverheadFactor": "0.4"
    "spark.driver.memoryOverheadFactor": "0.4"
    "spark.kubernetes.driver.ownPersistentVolumeClaim": "true"
    "spark.kubernetes.driver.reusePersistentVolumeClaim": "true"
    "spark.kubernetes.driver.waitToReusePersistentVolumeClaim": "true"
    "spark.shuffle.sort.io.plugin.class": "org.apache.spark.shuffle.KubernetesLocalDiskShuffleDataIO"
    "spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.claimName": "OnDemand"
    "spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.storageClass": "fast-storage-path"
    "spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.sizeLimit": "30Gi"
    "spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.readOnly": "false"
    "spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.path": "/data/spark-1/executor"
    "spark.local.dir": "/data/spark-1/executor"
    "spark.cleaner.periodicGC.interval": "1min"
    "spark.memory.storageFraction": "0.1"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.shuffle.targetPostShuffleInputSize": "128MB"
    "spark.sql.catalog.iceberg": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.iceberg.type": "hive"
    "spark.sql.catalog.local": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.local.commit.retry.max-wait-ms": "1000"
    "spark.sql.catalog.local.commit.retry.min-wait-ms": "100"
    "spark.sql.catalog.local.commit.retry.num-retries": "10"
    "spark.sql.catalog.local.type": "hadoop"
    "spark.sql.catalog.spark_catalog": "org.apache.iceberg.spark.SparkSessionCatalog"
    "spark.sql.defaultCatalog": "iceberg"
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.files.maxRecordsPerFile": "5000000"
    "spark.sql.shuffle.partitions": "5000"
    "spark.sql.sources.partitionOverwriteMode": "dynamic"
    "spark.sql.warehouse.dir": "hdfs://gbif-hdfs/stackable/warehouse"
    "write.distribution-mode": "hash"
    "spark.kubernetes.authenticate.driver.serviceAccountName": "cli-account"
  volumes:
    - name: ivy-settings
      configMap:
        name: gbif-airflow-ivy
        items:
          - key: ivy-settings.xml
            path: ivy-settings.xml
    - name: hdfs-env
      configMap:
        name: gbif-hdfs
        items:
          - key: core-site.xml
            path: core-site.xml
          - key: hdfs-site.xml
            path: hdfs-site.xml
    - name: hive-env
      configMap:
        name: gbif-hive-metastore-custom
        items:
          - key: hive-site.xml
            path: hive-site.xml
    - name: hbase-env
      configMap:
        name: gbif-hbase
        items:
          - key: hbase-site.xml
            path: hbase-site.xml
    - name: pipelines-spark-yaml
      configMap:
        name: pipelines-spark-yaml
        items:
          - key: pipelines-spark.yaml
            path: pipelines-spark.yaml
  job:
    podOverrides:
      metadata:
        labels:
          queue: "root.prod.pipelines"
    config:
      volumeMounts:
        - name: ivy-settings
          mountPath: /tmp/ivy-settings.xml
          subPath: ivy-settings.xml
  driver:
    podOverrides:
      metadata:
        labels:
          queue: "root.prod.pipelines"
      spec:
        nodeSelector:
          fastStorage: enabled
        initContainers:
          - name: job
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 250m
                memory: 128Mi
    config:
      resources:
        cpu:
          min: "4000m"
          max: "8000m"
        memory:
          limit: "30Gi"
      logging:
        enableVectorAgent: true
        containers:
          vector:
            file:
              level: "WARN"
          spark:
            console:
              level: "INFO"
            file:
              level: "WARN"
            loggers:
              ROOT:
                level: "INFO"
      volumeMounts:
        - name: ivy-settings
          mountPath: /tmp/ivy-settings.xml
          subPath: ivy-settings.xml
        - name: hdfs-env
          mountPath: /etc/hadoop/conf/core-site.xml
          subPath: core-site.xml
        - name: hdfs-env
          mountPath: /etc/hadoop/conf/hdfs-site.xml
          subPath: hdfs-site.xml
        - name: hive-env
          mountPath: /etc/hadoop/conf/hive-site.xml
          subPath: hive-site.xml
        - name: hbase-env
          mountPath: /etc/hadoop/conf/hbase-site.xml
          subPath: hbase-site.xml
        - name: pipelines-spark-yaml
          mountPath: /tmp/pipelines-spark.yaml
          subPath: pipelines-spark.yaml
  executor:
    podOverrides:
      metadata:
        labels:
          queue: "root.prod.pipelines"
          applicationId: metrics-report
      spec:
        nodeSelector:
          fastStorage: enabled
        initContainers:
          - name: job
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 250m
                memory: 128Mi
    config:
      resources:
        cpu:
          min: "1000m"
          max: "6000m"
        memory:
          limit: "30Gi"
      logging:
        enableVectorAgent: true
        containers:
          vector:
            file:
              level: "WARN"
          spark:
            console:
              level: "INFO"
            file:
              level: "WARN"
            loggers:
              ROOT:
                level: "INFO"
      volumeMounts:
        - name: ivy-settings
          mountPath: /tmp/ivy-settings.xml
          subPath: ivy-settings.xml
        - name: hdfs-env
          mountPath: /etc/hadoop/conf/core-site.xml
          subPath: core-site.xml
        - name: hdfs-env
          mountPath: /etc/hadoop/conf/hdfs-site.xml
          subPath: hdfs-site.xml
        - name: hive-env
          mountPath: /etc/hadoop/conf/hive-site.xml
          subPath: hive-site.xml
        - name: hbase-env
          mountPath: /etc/hadoop/conf/hbase-site.xml
          subPath: hbase-site.xml
        - name: pipelines-spark-yaml
          mountPath: /tmp/pipelines-spark.yaml
          subPath: pipelines-spark.yaml