
name: validator-orchestrator-local

services:
  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: localtest
      RABBITMQ_DEFAULT_PASS: localtest
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-validator-ws:
    image: docker.io/library/python:3.12-alpine
    command: ["python", "-u", "/mock/server.py"]
    volumes:
      - ./mock-ws/server.py:/mock/server.py:ro
    ports:
      - "127.0.0.1:18080:8080"

  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-localhost/validator-orchestrator:test}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock-validator-ws:
        condition: service_started
    volumes:
      - ./application-local.yml:/etc/validator-orchestrator/application-local.yml:ro
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/etc/validator-orchestrator/"
      SPRING_PROFILES_ACTIVE: local

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: localtest
      RABBITMQ_PASSWORD: localtest
      RABBITMQ_VHOST: /

      VALIDATOR_WS_URL: http://mock-validator-ws:8080
      VALIDATOR_WS_USERNAME: localtest
      VALIDATOR_WS_PASSWORD: localtest

    # Controlled local integration test only.

  # Real DwC-DP analyser, opt in with --profile analyser.
  analyser:
    profiles: ["analyser"]
    image: ${DWCDP_ANALYSER_IMAGE:-docker.gbif.org/dwc-dp-analyser-service:0.0.7-SNAPSHOT}
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: localtest
      RABBIT_PASSWORD: localtest
      RABBIT_VHOST: /
      INPUT_QUEUE: validator_dwcdp_analysis
      OUTPUT_EXCHANGE: occurrence
      OUTPUT_ROUTING_KEY: validator.dwcdp.analysis.finished
      REGISTRY_URL: ""
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ""
      DUCKDB_MEMORY: ${DUCKDB_MEMORY:-2GiB}
      DUCKDB_TEMP_DIR: /data/workdir/.tmp
      JVM_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=30.0 -Xms256m -Xmx1g"
    volumes:
      - ${DATAPACKAGES_DIR:-./datapackages}:/data/datapackages:ro
      - ${DWCDP_WORKDIR:-./workdir}:/data/workdir
